name: Build Key Circle Trainer APK

on:
  push:
    branches:
      - key-circle-apk-build
    paths:
      - .github/workflows/build-key-circle-apk.yml

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android-key-circle
          mkdir -p android-key-circle/app/src/main/java/com/keycircle/trainer

          cat > android-key-circle/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KeyCircleTrainer"
          include(":app")
          EOF

          cat > android-key-circle/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > android-key-circle/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.keycircle.trainer'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.keycircle.trainer'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat > android-key-circle/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="Key Circle Trainer"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > android-key-circle/app/src/main/java/com/keycircle/trainer/MainActivity.java <<'EOF'
          package com.keycircle.trainer;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Window;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private static final String APP_URL = "https://key-circle-trainer.vercel.app";
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  Window window = getWindow();
                  window.setStatusBarColor(Color.rgb(11, 16, 32));
                  window.setNavigationBarColor(Color.rgb(11, 16, 32));

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setSupportZoom(false);
                  settings.setBuiltInZoomControls(false);

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      private boolean isInternal(Uri uri) {
                          String host = uri.getHost();
                          return host != null && host.endsWith("key-circle-trainer.vercel.app");
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          if (isInternal(uri)) return false;
                          startActivity(new Intent(Intent.ACTION_VIEW, uri));
                          return true;
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          Uri uri = Uri.parse(url);
                          if (isInternal(uri)) return false;
                          startActivity(new Intent(Intent.ACTION_VIEW, uri));
                          return true;
                      }
                  });

                  webView.loadUrl(APP_URL);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) webView.destroy();
                  super.onDestroy();
              }
          }
          EOF

      - name: Build debug APK
        working-directory: android-key-circle
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p key-circle-apk
          cp android-key-circle/app/build/outputs/apk/debug/app-debug.apk key-circle-apk/KeyCircleTrainer.apk
          cat > key-circle-apk/build-status.txt <<EOF
          status=success
          run_id=\${GITHUB_RUN_ID}
          commit=\${GITHUB_SHA}
          built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyCircleTrainer-APK
          path: key-circle-apk/KeyCircleTrainer.apk
          if-no-files-found: error
          retention-days: 7

      - name: Commit build marker and APK to build branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add key-circle-apk/KeyCircleTrainer.apk key-circle-apk/build-status.txt
          git commit -m "Build Key Circle Trainer APK [skip ci]"
          git push origin HEAD:key-circle-apk-build
